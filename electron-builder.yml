appId: studio.beatframe.app
productName: BeatFrame Studio
copyright: Copyright © 2026 BeatFrame Studio contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

asarUnpack:
  # FFmpeg binaries must live outside the asar archive so they can be spawned.
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  # Generated by scripts/make-icon.mjs
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: BeatFrame Studio

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.video

linux:
  target:
    - AppImage
  category: AudioVideo
  icon: build/icon.png

publish: null
