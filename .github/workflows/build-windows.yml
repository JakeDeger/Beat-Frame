name: Build Windows installer

on:
  # Run manually from the Actions tab on any branch. Providing release_tag
  # creates (or updates) a GitHub Release with the installer attached — useful
  # where pushing tags directly isn't possible.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0). When set, a GitHub Release is created with the installer attached.'
        required: false
        default: ''
  # Build + attach the installer to a GitHub Release when a version tag is pushed.
  push:
    tags:
      - 'v*'

# Needed so the tag builds can create GitHub Releases and attach the installer.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatFrame-Studio-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release/*.exe
          generate_release_notes: true
